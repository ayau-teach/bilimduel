<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>БІЛІМ ДУӘЛІ: ТАҚТАДАҒЫ ЖЕКПЕ-ЖЕК</title>
<style>
:root{--red:#b3001b;--red2:#ff2d3f;--blk:#0b0b0b;--panel:#161012;--gold:#f5b301;--ink:#f3e6c8}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(#2a0509,#000 70%);color:var(--ink);font-family:'Trebuchet MS','Arial Black',sans-serif;font-weight:700;min-height:100vh}
h1,h2,h3{font-family:Impact,'Arial Black',sans-serif;letter-spacing:2px;text-transform:uppercase;margin:0;color:var(--gold);text-shadow:3px 3px 0 var(--red)}
h1{font-size:clamp(24px,6vw,48px);text-align:center;padding:14px 8px 4px}
main{max-width:1000px;margin:auto;padding:10px}
.card{background:var(--panel);border:4px solid var(--gold);box-shadow:0 0 0 4px var(--blk),6px 6px 0 6px var(--red);padding:14px;margin:12px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip,.btn{background:var(--blk);color:var(--ink);border:3px solid var(--gold);padding:9px 13px;cursor:pointer;font:inherit;text-transform:uppercase}
.chip.on,.btn:hover,.chip:hover{background:var(--red);color:#fff}
.btn.big{background:var(--red);font-size:18px;padding:12px 20px}
.btn:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
.px{width:96px;height:134px;object-fit:cover;border:3px solid var(--gold);background:#000}
.chars .chip{display:flex;flex-direction:column;align-items:center;font-size:12px;padding:6px}
.chars .px{width:56px;height:78px}
.arena{background-size:cover;background-position:center bottom;position:relative;height:230px;border:4px solid var(--gold);display:flex;justify-content:space-between;align-items:flex-end;padding:0 6%;overflow:hidden}
.fgt{text-align:center;transition:transform .2s}
.fgt .px{width:110px;height:154px}
.fgt.hit{animation:hit .5s}.fgt.miss{animation:hit .5s;filter:hue-rotate(120deg)}
@keyframes hit{25%{transform:translateX(-14px)}50%{transform:translateX(14px)}75%{transform:translateX(-8px)}}
.hpwrap{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.hp{flex:1;height:22px;background:#300;border:3px solid var(--gold);position:relative}
.hp i{display:block;height:100%;background:linear-gradient(#ffe36b,#e07b00);transition:width .5s}
.hp.r{transform:scaleX(-1)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.opts{grid-template-columns:1fr}.fgt .px{width:80px;height:112px}.arena{height:190px}}
.opt{padding:14px;text-align:left;font-size:16px}
.opt.ok{background:#0a7a2a;color:#fff}.opt.no{background:#444;text-decoration:line-through}.opt.me{border-color:#fff}
.q{font-size:clamp(16px,3.5vw,22px);margin:10px 0}
.timer{height:8px;background:var(--gold);transform-origin:left;animation:t 25s linear forwards}
@keyframes t{to{transform:scaleX(0)}}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{border-bottom:1px solid #5a3a3a;padding:5px;text-align:left}
.on{color:#6bff8a}.off{color:#777}
.sc{height:16px;background:var(--red2);margin:3px 0}
#fw{position:fixed;inset:0;pointer-events:none;z-index:9}
#win{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;background:#000a}
#win h2{font-size:clamp(26px,6vw,54px);line-height:1.2}
.note{font-size:13px;opacity:.8}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

 1:['Алиев Алтынбек','Әшіл Жанерке','Қалдымұратова Нұрзат','Смаилова Еркежан','Ерболат Алпамыс'],

/* ===== ДЫБЫС (placeholder: ішіндегі URL-дерді өз файлдарыңызға ауыстырыңыз) ===== */
const SFX={hit:[220,.15],miss:[110,.25],win:[660,.4],click:[440,.05]};
function sfx(n){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.frequency.value=SFX[n][0];o.type='square';o.connect(a.destination);o.start();o.stop(a.currentTime+SFX[n][1])}catch(e){}}
/* ===== СҰРАҚТАР ГЕНЕРАТОРЫ (барлық құрылғыда бірдей, seed бойынша) ===== */
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const med=a=>{const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2},avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
const fmt=x=>String(Math.round(x*100)/100).replace('.',',');
function genQ(seed,qi){
 const r=rng(seed*131+qi*7919),ri=(a,b)=>a+Math.floor(r()*(b-a+1)),mk=(n,l,h)=>Array.from({length:n},()=>ri(l,h));
 const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
 const t=ri(0,5);let text,ans,pool;const L=a=>a.join(', ');
 if(t==0){const a=mk(5,3,15).sort((x,y)=>x-y);ans=avg(a)-med(a);text=`Берілген деректер қатары: ${L(a)}. Орташа арифметикалық пен медиананың айырмасы (орташа − медиана) нешеге тең?`;pool=[ans+1,ans-1,ans+2,ans+.2,ans-.5,ans+3]}
 else if(t==1){const x=ri(2,9),o=new Set();while(o.size<4){const v=ri(1,15);if(v!=x)o.add(v)}const a=shuf([x,x,x,...o]);ans=x;text=`Берілген деректер қатары: ${L(a)}. Берілген қатардың модасын табыңыз.`;pool=a.filter(v=>v!=x)}
 else if(t==2){const a=mk(6,2,20);ans=med(a);text=`Берілген деректер қатары: ${L(a)}. Осы қатардың медианасы нешеге тең?`;pool=[ans+1,ans-1,ans+.5,ans-.5,ans+2,avg(a)]}
 else if(t==3){const a=mk(4,3,14);let s=a.reduce((x,y)=>x+y,0);const l=ri(3,14);a.push(l+((5-(s+l)%5)%5));ans=avg(a);text=`Берілген деректер қатары: ${L(shuf(a))}. Орташа арифметикалық мәнін табыңыз.`;pool=[ans+1,ans-1,ans+2,ans-2,med(a),ans+.5]}
 else if(t==4){const a=mk(4,3,12),m=ri(7,12),s=a.reduce((x,y)=>x+y,0);ans=5*m-s;text=`Бес санның орташа арифметикалық мәні ${m}-ге тең. Төртеуі: ${L(a)}. Бесінші санды табыңыз.`;pool=[ans+1,ans-1,ans+2,ans-2,ans+5,m]}
 else{const a=mk(6,1,30);ans=Math.max(...a)-Math.min(...a);text=`Берілген деректер қатары: ${L(a)}. Қатардың ауқымын (максимум − минимум) табыңыз.`;pool=[ans+1,ans-1,ans+2,ans-2,Math.max(...a),ans+4]}
 const w=[];shuf(pool).forEach(v=>{if(v!=ans&&(t==0||v>=0)&&!w.includes(v)&&w.length<3)w.push(v)});for(let k=1;w.length<3;k++)if(!w.includes(ans+10+k))w.push(ans+10+k);
 const o=shuf([ans,...w]);return{text,opts:o.map(fmt),ans:o.indexOf(ans)}}
/* ===== ЖАЛПЫ ЖАҒДАЙ ===== */
const $=s=>document.querySelector(s),app=$('#app');
const CH=typeof BroadcastChannel!=='undefined'?new BroadcastChannel('bilim-duel'):null;
/* ТРАНСПОРТ: нақты құрылғылар арасында жұмыс істеу үшін send/onmessage-ті WebSocket/Firebase-ке ауыстырыңыз */
const send=m=>CH&&CH.postMessage(m);
let role=null,G={phase:'lobby',players:{},matches:[],winner:null},me={},step=0,sel={},hint={},fwOn=false;
const L='ABCD';
const gScore=g=>Object.values(G.players).filter(p=>p.group==g).reduce((s,p)=>s+p.score,0);
const rep=g=>Object.values(G.players).filter(p=>p.group==g&&p.char!=null).sort((a,b)=>b.seen-a.seen)[0];
const mkM=(id,title,a,b)=>({id,title,a,b,hp:{[a]:100,[b]:100},qi:0,n:15+Math.floor(Math.random()*6),seed:Math.floor(Math.random()*1e6),locked:{},status:'play',t:Date.now(),last:'Жекпе-жек басталды!',flash:null,resolved:false});

function endM(m){m.status='end';const A=m.hp[m.a],B=m.hp[m.b];m.winner=A!=B?(A>B?m.a:m.b):(gScore(m.a)>=gScore(m.b)?m.a:m.b);m.loser=m.winner==m.a?m.b:m.a;m.last+=` · Жеңімпаз: ${m.winner}-топ`}
function advance(m){m.locked={};m.resolved=false;m.qi++;m.t=Date.now();if(m.qi>=m.n||m.hp[m.a]<=0||m.hp[m.b]<=0)endM(m);phase()}

function chips(arr,key,fn){return`<div class="chips">${arr.map((a,i)=>`<button class="chip ${picked(key,a.v)?'on':''}" onclick="pick('${key}',${JSON.stringify(a.v).replace(/"/g,'&quot;')})">${a.l}</button>`).join('')}</div>`}
const picked=(k,v)=>me[k]===v;
function pick(k,v){sfx('click');me[k]=v;if(k=='group'){delete me.name;delete me.helper}if(k=='name')me.pid=me.group+':'+v;step=Math.max(step,['group','name','char','arena','helper'].indexOf(k)+1);render()}
function setupView(){
 const g=me.group;let h=`<div class="card"><h2>Жауынгерді дайындау</h2><p>1. Топты таңдаңыз</p>${chips([1,2,3,4].map(x=>({v:x,l:x+'-топ'})),'group')}`;
 if(g){h+=`<p>2. Аты-жөніңізді таңдаңыз</p>${chips(ROSTER[g].map(n=>({v:n,l:n})),'name')}`}
 if(me.name){h+=`<p>3. Батырды таңдаңыз</p><div class="chips chars">${FIGHTERS.map((f,i)=>`<button class="chip ${me.char===i?'on':''}" onclick="pick('char',${i})"><img class="px" src="${sprite(i)}" alt="">${f[0]}</button>`).join('')}</div>`}
 if(me.char!=null){h+=`<p>4. Арена</p>${chips(ARENAS.map((n,i)=>({v:i,l:n})),'arena')}`}
 if(me.arena!=null){h+=`<p>5. Көмекші (топтағы стратег)</p>${chips(ROSTER[g].filter(n=>n!=me.name).map(n=>({v:n,l:n})),'helper')}`}
 if(me.helper)h+=`<button class="btn big" onclick="ready()">⚔ ТАЙҒА ШЫҒУ!</button>`;
 app.innerHTML=h+'</div>'}
function ready(){me.ready=true;me.score=0;send({t:'hb',p:me});render()}
function bar(g,m,r){return`<div class="hp ${r?'r':''}"><i style="width:${m.hp[g]}%"></i></div>`}
function fighter(g,m,mine){const p=mine?me:rep(g),c=p&&p.char!=null?p.char:(g*7)%36,f=m.flash&&m.flash.g==g&&Date.now()-m.flash.t<900?m.flash.k:'';
 return`<div class="fgt ${mine?'':'r'} ${f}"><img class="px" src="${sprite(c)}" alt=""><div class="note">${g}-топ · ${FIGHTERS[c][0]}</div></div>`}
function playView(){
 const g=me.group;if(G.phase=='lobby'||!G.matches.length){app.innerHTML=`<div class="card"><h2>Күту залы</h2><p>${me.name} · ${g}-топ. Админ турнирді бастағанша күтіңіз...</p><p class="note">Админ қойындысы ашық болуы керек.</p></div>`;return}
 const mine=G.matches.filter(m=>m.a==g||m.b==g),m=mine.find(m=>m.status=='play')||mine[mine.length-1],o=m.a==g?m.b:m.a;
 let h=`<div class="card"><h3>${m.title}</h3><div class="hpwrap"><b>${g}</b>${bar(g,m)}${bar(o,m,1)}<b>${o}</b></div><div class="arena" style="background-image:url(${ARENA_IMG[me.arena]})">${fighter(g,m,1)}${fighter(o,m,0)}</div><p class="note">${m.last}</p>`;
 if(m.status=='end'){const w=m.winner==g;h+=`<h2>${w?'🏆 ЖЕҢІС!':'💀 ЖЕҢІЛІС'}</h2><p>${G.phase=='semiDone'?'Админ келесі кезеңді бастағанша күтіңіз.':''}</p>`}
 else{const q=genQ(m.seed,m.qi),key=m.id+m.qi,s=sel[key],lock=s!=null||m.locked[me.pid]||m.resolved,hu=!!hint[m.id+m.qi],bad=(q.ans+1)%4;
  h+=`<div class="timer" style="animation-delay:-${(Date.now()-m.t)/1000}s"></div><div class="q">Сұрақ ${m.qi+1}/${m.n}: ${q.text}</div><div class="opts">${q.opts.map((t,i)=>`<button class="btn opt ${m.resolved&&i==q.ans?'ok':''} ${hu&&i==bad?'no':''} ${s==i?'me':''}" ${lock?'disabled':''} onclick="answer('${m.id}',${m.qi},${i})">${L[i]}) ${t}</button>`).join('')}</div>
  <div class="chips"><button class="btn" ${hu?'disabled':''} onclick="useHint('${m.id}',${m.qi})">🧠 Көмекші: ${me.helper}</button></div>${hu?`<p>${me.helper}: «${L[bad]} нұсқасы дұрыс емес!»</p>`:''}`}
 app.innerHTML=h+`</div>`}
function answer(mid,qi,k){sfx('hit');sel[mid+qi]=k;send({t:'ans',mid,qi,k,pid:me.pid});render()}
function useHint(id,qi){hint[id+qi]=1;render()}
function adminView(){
 const ps=Object.values(G.players).sort((a,b)=>b.score-a.score),now=Date.now(),mx=Math.max(1,...[1,2,3,4].map(gScore));
 let h=`<div class="card"><h2>Админ панелі · Live</h2><div class="chips"><button class="btn big" ${G.phase!='lobby'?'disabled':''} onclick="startSemi()">▶ Турнирді бастау</button><button class="btn big" ${G.phase!='semiDone'?'disabled':''} onclick="startFinal()">🏆 Финал + 3-орын</button><button class="btn" onclick="resetAll()">↺ Қайта бастау</button></div><p>Кезең: <b>${G.phase}</b> · Қатысушылар: ${ps.filter(p=>now-p.seen<6000).length} онлайн / ${ps.length}</p></div>`;
 h+=`<div class="card"><h3>Матчтар</h3>${G.matches.map(m=>`<p>${m.title}: ${m.a}-топ <b>${m.hp[m.a]}</b> HP ⚔ <b>${m.hp[m.b]}</b> HP ${m.b}-топ · сұрақ ${Math.min(m.qi+1,m.n)}/${m.n} ${m.status=='end'?'· ✔ '+m.winner+'-топ жеңді':''}<br><span class="note">${m.last}</span></p>`).join('')||'<p class="note">Матч жоқ</p>'}</div>`;
 h+=`<div class="card"><h3>Топтар рейтингі</h3>${[1,2,3,4].sort((a,b)=>gScore(b)-gScore(a)).map(g=>`<div>${g}-топ: ${gScore(g)} ұпай<div class="sc" style="width:${Math.max(2,gScore(g)/mx*100)}%"></div></div>`).join('')}</div>`;
 h+=`<div class="card"><h3>Қатысушылар</h3><table><tr><th></th><th>Аты-жөні</th><th>Топ</th><th>Соңғы жауап</th><th>Ұпай</th></tr>${ps.map(p=>`<tr><td class="${now-p.seen<6000?'on':'off'}">●</td><td>${p.name}</td><td>${p.group}</td><td>${p.last||'—'}</td><td>${p.score}</td></tr>`).join('')}</table></div>`;
 app.innerHTML=h}
/* ===== ОТШАШУ ===== */
function celebrate(){fwOn=true;sfx('win');const w=G.winner;$('#winTxt').textContent='“Жарайсыңдар, ақылды өздеріне старосталарына ұқсаған😘”';$('#winSub').textContent=`🏆 ${w}-топ — ЧЕМПИОН!`;$('#win').style.display='flex';
 const c=$('#fw'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;let P=[];
 const boom=()=>{const cx=Math.random()*c.width,cy=Math.random()*c.height*.6,col=`hsl(${Math.random()*360},100%,60%)`;for(let i=0;i<60;i++){const a=Math.random()*6.283,s=Math.random()*5+1;P.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:70,col})}};
 (function loop(){x.fillStyle='rgba(0,0,0,.18)';x.fillRect(0,0,c.width,c.height);if(Math.random()<.08)boom();P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.l--;x.fillStyle=p.col;x.fillRect(p.x,p.y,3,3)});P=P.filter(p=>p.l>0);requestAnimationFrame(loop)})()}
render();
</script>
</body>
</html>
